<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抖音电商·千川 - AI创意Agent - 对话详情</title>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; color: #333; background: #f5f7fa; }
    
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    
    .header {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-left { display: flex; align-items: center; gap: 32px; }
    
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 18px; font-weight: 700; color: #333; }
    
    .nav { display: flex; align-items: center; gap: 0; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 16px;
      height: 56px;
      background: transparent;
      border: none;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .nav-item:hover { color: #0066FF; }
    .nav-item.active { color: #0066FF; font-weight: 600; }
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: #0066FF;
      border-radius: 1px;
    }
    .nav-item.highlight { color: #0066FF; }
    
    .new-badge {
      font-size: 10px;
      padding: 1px 5px;
      background: linear-gradient(135deg, #FF4D4F 0%, #FF3A3E 100%);
      color: #fff;
      border-radius: 10px;
      font-weight: 500;
    }
    
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #999;
      cursor: pointer;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      min-height: calc(100vh - 56px);
    }
    
    .chat-panel {
      width: 380px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      z-index: 50;
    }
    
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    
    .chat-actions {
      display: flex;
      gap: 8px;
    }
    
    .action-btn {
      padding: 6px 12px;
      background: #f5f5f5;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }
    
    .action-btn:hover {
      background: #e8e8e8;
    }
    
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    
    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    
    .message.ai .avatar {
      background: linear-gradient(135deg, #0066FF 0%, #0047CC 100%);
    }
    
    .message.user .avatar {
      background: linear-gradient(135deg, #00C853 0%, #00B84E 100%);
    }
    
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .avatar span {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    
    .message-content {
      flex: 1;
      max-width: calc(100% - 46px);
    }
    
    .message-text {
      background: #f5f7fa;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.6;
      color: #333;
      font-size: 13px;
    }
    
    .message.user .message-text {
      background: linear-gradient(135deg, #0066FF 0%, #0047CC 100%);
      color: #fff;
    }
    
    .message-time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    
    .chat-input-section {
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
    }
    
    .chat-input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f5f7fa;
      border-radius: 20px;
      padding: 6px 14px;
    }
    
    .chat-input-field {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: #333;
    }
    
    .chat-input-field::placeholder {
      color: #999;
    }
    
    .chat-send-btn {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0066FF 0%, #0047CC 100%);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .chat-suggestions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    
    .chat-suggestion-tag {
      padding: 5px 10px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 14px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }
    
    .chat-suggestion-tag:hover {
      border-color: #0066FF;
      color: #0066FF;
    }
    
    .content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #f5f7fa;
    }
    
    .progress-section {
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
    }
    
    .progress-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    
    .progress-icon {
      width: 20px;
      height: 20px;
      background: #0066FF;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
    }
    
    .progress-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .progress-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    
    .progress-step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 16px;
      left: calc(50% + 24px);
      width: calc(100% - 48px);
      height: 4px;
      background: #e8e8e8;
      z-index: 0;
      border-radius: 2px;
    }
    
    .progress-step.active:not(:last-child)::after {
      background: linear-gradient(90deg, #0066FF, #0066FF);
    }
    
    .progress-step.completed:not(:last-child)::after {
      background: linear-gradient(90deg, #00C853, #00C853);
    }
    
    .step-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      font-size: 14px;
      font-weight: 600;
      color: #999;
      transition: all 0.3s ease;
    }
    
    .progress-step.active .step-dot {
      background: #0066FF;
      color: #fff;
      transform: scale(1.1);
    }
    
    .progress-step.completed .step-dot {
      background: #00C853;
      color: #fff;
    }
    
    .step-label {
      font-size: 13px;
      color: #999;
      margin-top: 8px;
      text-align: center;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    
    .progress-step.active .step-label {
      color: #0066FF;
      font-weight: 600;
    }
    
    .progress-step.completed .step-label {
      color: #00C853;
      font-weight: 600;
    }
    
    .stage-detail-section {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    
    .stage-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    
    .stage-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .stage-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #0066FF 0%, #0047CC 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }
    
    .stage-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    
    .stage-status {
      padding: 4px 12px;
      background: #E8F5E9;
      border-radius: 12px;
      font-size: 12px;
      color: #2E7D32;
    }
    
    .stage-status.processing {
      background: #FFF3E0;
      color: #E65100;
    }
    
    .stage-status.completed {
      background: #E8F5E9;
      color: #2E7D32;
    }
    
    .stage-divider {
      height: 1px;
      background: #f0f0f0;
      margin: 20px 0;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #666;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .section-title::before {
      content: '';
      width: 4px;
      height: 14px;
      background: #0066FF;
      border-radius: 2px;
    }
    
    .input-content {
      background: #f8fafc;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    
    .input-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    
    .input-value {
      font-size: 14px;
      color: #333;
      line-height: 1.6;
    }
    
    .system-action {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
    }
    
    .action-icon {
      width: 24px;
      height: 24px;
      background: #E3F2FD;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1976D2;
      flex-shrink: 0;
    }
    
    .action-text {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    
    .output-content {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    
    .output-header {
      padding: 12px 16px;
      background: #fafafa;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
    }
    
    .output-title {
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }
    
    .output-meta {
      font-size: 11px;
      color: #999;
    }
    
    .output-body {
      padding: 16px;
    }
    
    .output-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    
    .output-item:last-child {
      border-bottom: none;
    }
    
    .output-thumb {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #f5f5f5;
      object-fit: cover;
    }
    
    .output-info {
      flex: 1;
    }
    
    .output-name {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
    }
    
    .output-desc {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }
    
    .output-tags {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    
    .output-tag {
      padding: 2px 8px;
      background: #E3F2FD;
      border-radius: 4px;
      font-size: 11px;
      color: #1976D2;
    }
    
    .interactive-section {
      display: flex;
      gap: 12px;
    }
    
    .interactive-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #0066FF;
      border-radius: 10px;
      background: #fff;
      color: #0066FF;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .interactive-btn:hover {
      background: #F0F5FF;
    }
    
    .interactive-btn.primary {
      background: linear-gradient(135deg, #0066FF 0%, #0047CC 100%);
      border: none;
      color: #fff;
    }
    
    .interactive-btn.primary:hover {
      opacity: 0.9;
    }
    
    .stage-detail-section {
      position: relative;
      padding-bottom: 100px;
    }
    
    .interactive-section-wrapper {
      position: sticky;
      bottom: 0;
      background: #f5f7fa;
      padding: 16px 24px;
      z-index: 40;
    }
    
    @media (max-width: 1024px) {
      .chat-panel { width: 320px; }
    }
    
    @media (max-width: 768px) {
      .main-content { flex-direction: column; }
      .chat-panel { width: 100%; border-right: none; border-bottom: 1px solid #e8e8e8; }
    }

    .marketing-card {
      position: relative;
    }
    .marketing-card .actions {
      position: absolute;
      top: 8px;
      right: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .marketing-card:hover .actions {
      opacity: 1;
    }
    .marketing-time {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e8e8e8;
      font-size: 12px;
      color: #999;
      cursor: pointer;
    }
    .marketing-time:hover {
      color: #0066FF;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      max-width: 90%;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .modal-content {
      margin-bottom: 20px;
    }
    .system-nodes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .system-node-tag {
      padding: 6px 12px;
      background: #f5f7fa;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .system-node-tag:hover {
      border-color: #0066FF;
      color: #0066FF;
    }
    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .date-range-inputs {
      display: flex;
      gap: 12px;
    }
    .date-input {
      flex: 1;
    }
    .date-input label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }
    .date-input input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: none;
    }
    .modal-btn-cancel {
      background: #f5f5f5;
      color: #666;
    }
    .modal-btn-confirm {
      background: linear-gradient(135deg, #0066FF 0%, #0047CC 100%);
      color: white;
    }

    .editable-text {
      cursor: text;
      border-radius: 4px;
      transition: background 0.2s;
      min-height: 1.4em;
    }
    .editable-text:hover {
      background: #e3f2fd;
    }
    .editable-text:focus {
      outline: 2px solid #0066FF;
      background: #fff;
    }
    .editable-text:empty::before {
      content: '双击编辑';
      color: #999;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <nav class="nav">
          <button class="nav-item">首页</button>
          <button class="nav-item">乘方</button>
          <button class="nav-item">全域投放</button>
          <button class="nav-item">品牌投放</button>
          <button class="nav-item highlight active" onclick="window.location.href='index.html'">AI创意 <span class="new-badge">BETA</span></button>
          <button class="nav-item">数据</button>
          <button class="nav-item">工具</button>
          <button class="nav-item">财务</button>
          <button class="nav-item">营销</button>
          <button class="nav-item">学堂</button>
        </nav>
      </div>
      <div class="header-right">
        <button class="header-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
            <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
        <button class="header-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <div class="chat-panel">
        <div class="chat-header">
          <span class="chat-title">创作任务详情</span>
          <div class="chat-actions">
            <button class="action-btn" onclick="createAsSkill()">创建为Skill</button>
          </div>
        </div>
        
        <div class="chat-messages">
          <div class="message user">
            <div class="avatar"><span>U</span></div>
            <div class="message-content">
              <div class="message-text">帮我为商品DO双层养肤气垫粉饼保湿控油持久定妆生成一个30秒带货视频</div>
              <div class="message-time">10:30</div>
            </div>
          </div>
          
          <div class="message ai">
            <div class="avatar"><span>AI</span></div>
            <div class="message-content">
              <div class="message-text">收到你的需求，将结合商品特点和目标人群为商品DO双层养肤气垫粉饼保湿控油持久定妆创作一个带货视频，创作将按照专业的创作步骤展开，每个步骤您可以参与修改或者直接确认进入下一步。</div>
              <div class="message-time">10:31</div>
            </div>
          </div>
          
          <div class="message ai">
            <div class="avatar"><span>AI</span></div>
            <div class="message-content">
              <div class="message-text">现在进入第一步：商品解析。我将为您自动抓取商品信息、提炼核心卖点、分析目标人群，并进行平台合规预检。</div>
              <div class="message-time">10:32</div>
            </div>
          </div>
        </div>
        
        <div class="chat-input-section">
          <div class="chat-input-box">
            <input 
              type="text" 
              class="chat-input-field" 
              placeholder="输入您的需求，我来帮您完成..."
            />
            <button class="chat-send-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="content-panel">
        <div class="progress-section">
          <div class="progress-bar">
            <div class="progress-step active">
              <div class="step-dot">1</div>
              <div class="step-label">商品解析</div>
            </div>
            <div class="progress-step">
              <div class="step-dot">2</div>
              <div class="step-label">创意灵感</div>
            </div>
            <div class="progress-step">
              <div class="step-dot">3</div>
              <div class="step-label">脚本生成</div>
            </div>
            <div class="progress-step">
              <div class="step-dot">4</div>

  <script>
    // 打字机效果函数
    function typeWriterEffect(element, text, speed = 30) {
      let i = 0;
      element.textContent = '';
      element.classList.add('typing');
      
      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          setTimeout(type, speed);
        } else {
          element.classList.remove('typing');
        }
      }
      
      type();
    }
    
    // 添加AI消息并带有打字机效果
    function addAIMessageWithTyping(text, callback) {
      var messageContainer = document.querySelector('.chat-messages');
      var newMessage = document.createElement('div');
      newMessage.className = 'message ai';
      newMessage.innerHTML = `
        <div class="avatar"><span>AI</span></div>
        <div class="message-content">
          <div class="message-text"></div>
          <div class="message-time">${new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})}</div>
        </div>
      `;
      messageContainer.appendChild(newMessage);
      messageContainer.scrollTop = messageContainer.scrollHeight;
      
      var textElement = newMessage.querySelector('.message-text');
      typeWriterEffect(textElement, text, 25);
      
      // 打字完成后执行回调
      if (callback) {
        var checkTyping = setInterval(function() {
          if (!textElement.classList.contains('typing')) {
            clearInterval(checkTyping);
            setTimeout(callback, 300);
          }
        }, 100);
      }
    }
    
    // 页面加载时模拟AI回复的打字效果
    document.addEventListener('DOMContentLoaded', function() {
      var aiMessages = document.querySelectorAll('.message.ai .message-text');
      var messages = [];
      
      // 保存所有AI消息内容并隐藏
      aiMessages.forEach(function(msg, index) {
        messages.push(msg.textContent);
        msg.textContent = '';
        msg.parentElement.parentElement.style.display = 'none';
      });
      
      // 模拟AI思考时间后开始回复
      setTimeout(function() {
        // 显示第一条AI消息并开始打字
        var firstMsg = aiMessages[0];
        firstMsg.parentElement.parentElement.style.display = 'flex';
        typeWriterEffect(firstMsg, messages[0], 25);
        
        // 等待第一条消息打字完成后，显示第二条消息
        var checkFirst = setInterval(function() {
          if (!firstMsg.classList.contains('typing')) {
            clearInterval(checkFirst);
            
            // 模拟思考时间
            setTimeout(function() {
              // 显示第二条AI消息并开始打字
              var secondMsg = aiMessages[1];
              secondMsg.parentElement.parentElement.style.display = 'flex';
              typeWriterEffect(secondMsg, messages[1], 25);
              
              // 等待第二条消息打字完成后，开始加载右侧内容
              var checkSecond = setInterval(function() {
                if (!secondMsg.classList.contains('typing')) {
                  clearInterval(checkSecond);
                  loadStageOneWithAnimation();
                }
              }, 100);
            }, 600);
          }
        }, 100);
      }, 500);
    });
    
    // 阶段一加载动画：先显示系统处理，再显示商品解析结果
    function loadStageOneWithAnimation() {
      var stageDetailSection = document.querySelector('.stage-detail-section');
      
      // 先只显示系统处理部分
      stageDetailSection.innerHTML = `
        <div class="stage-card" id="stage1-loading">
          <div>
            <div class="section-title">系统处理</div>
            <div class="system-action loading-action">
              <span class="action-icon loading-icon">📥</span>
              <span class="action-text">信息自动抓取：调用巨量千川商品库接口，自动获取商品标题、详情页图文、SKU属性、价格（日常价/活动价）、用户评论等信息</span>
            </div>
            <div class="system-action loading-action" style="opacity: 0.3;">
              <span class="action-icon">✨</span>
              <span class="action-text">卖点与场景提炼：利用大语言模型分析抓取到的信息，提炼核心卖点（如成分、功效、材质、设计、价格优势）和适用场景/人群（如"熬夜党"、"敏感肌"、"户外运动爱好者"）</span>
            </div>
            <div class="system-action loading-action" style="opacity: 0.3;">
              <span class="action-icon">✅</span>
              <span class="action-text">平台合规预检：基于平台广告审核规则，对商品信息和卖点文案进行初步扫描，识别潜在的违规词或夸大宣传风险</span>
            </div>
          </div>
        </div>
      `;
      
      // 模拟加载过程
      var actions = document.querySelectorAll('.loading-action');
      var icons = document.querySelectorAll('.loading-icon');
      
      // 添加加载动画样式
      icons.forEach(function(icon) {
        icon.style.animation = 'pulse 1s infinite';
      });
      
      setTimeout(function() {
        actions[1].style.transition = 'opacity 0.5s';
        actions[1].style.opacity = '1';
        
        setTimeout(function() {
          actions[2].style.transition = 'opacity 0.5s';
          actions[2].style.opacity = '1';
          
          setTimeout(function() {
            // 显示完整的商品解析结果
            showStageOne();
          }, 800);
        }, 800);
      }, 800);
    }
    
    function showActions(el) {
      el.querySelector('.actions').style.opacity = '1';
    }
    
    function hideActions(el) {
      el.querySelector('.actions').style.opacity = '0';
    }
    
    function showTagActions(el) {
      var closeBtn = document.createElement('span');
      closeBtn.innerHTML = '×';
      closeBtn.style.cssText = 'position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; background: #ff4d4f; border-radius: 50%; color: white; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;';
      closeBtn.onclick = function(e) {
        e.stopPropagation();
        el.remove();
      };
      el.appendChild(closeBtn);
    }
    
    function hideTagActions(el) {
      var closeBtn = el.querySelector('span:last-child');
      if (closeBtn && closeBtn.innerHTML === '×') {
        closeBtn.remove();
      }
    }
    
    function editItem(btn) {
      var card = btn.parentElement.parentElement;
      var title = card.querySelector('div:first-child');
      var desc = card.querySelector('div:nth-child(2)');
      
      var newTitle = prompt('请输入卖点标题:', title.textContent);
      if (newTitle) {
        title.textContent = newTitle;
      }
      
      var newDesc = prompt('请输入卖点描述:', desc.textContent);
      if (newDesc) {
        desc.textContent = newDesc;
      }
    }
    
    function deleteItem(btn) {
      var card = btn.parentElement.parentElement;
      if (confirm('确定删除这个卖点吗？')) {
        card.remove();
      }
    }
    
    function deleteImage(btn) {
      var container = btn.parentElement;
      if (confirm('确定删除这张图片吗？')) {
        container.remove();
      }
    }
    
    function uploadImage(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var imgContainer = document.createElement('div');
          imgContainer.style.cssText = 'position: relative;';
          imgContainer.innerHTML = `<img src="${e.target.result}" alt="上传图片" style="width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: #f5f5f5;"/><button onclick="deleteImage(this)" style="position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: rgba(0,0,0,0.6); border-radius: 50%; color: white; font-size: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">×</button>`;
          var grid = document.querySelector('#卖点-container').parentElement.parentElement.previousElementSibling.querySelector('[style*="grid-template-columns"]');
          grid.appendChild(imgContainer);
        };
        reader.readAsDataURL(input.files[0]);
        input.value = '';
      }
    }
    
    function addSellingPoint() {
      var container = document.getElementById('卖点-container');
      var title = prompt('请输入卖点标题（如：🔥 持久控油）:');
      if (!title) return;

      var desc = prompt('请输入卖点描述:');
      if (!desc) return;

      var containsWhiteningWrinkle = title.includes('美白') || title.includes('去皱') || desc.includes('美白') || desc.includes('去皱');

      var warningHtml = '';
      if (containsWhiteningWrinkle) {
        warningHtml = `
          <div style="margin-top: 8px; padding: 8px; background: #FFF1F0; border: 1px solid #FF4D4F; border-radius: 4px; display: flex; align-items: flex-start; gap: 6px;">
            <span style="color: #FF4D4F; font-size: 12px;">⚠️</span>
            <div style="color: #FF4D4F; font-size: 11px; line-height: 1.4;">该产品详情页和发布时未出现美白去皱卖点，该卖点宣传需要化妆品备案！</div>
          </div>
        `;
      }

      var newCard = document.createElement('div');
      newCard.style.cssText = 'padding: 12px; background: #f8fafc; border-radius: 8px; position: relative;';
      newCard.onmouseenter = function() { showActions(this); };
      newCard.onmouseleave = function() { hideActions(this); };

      newCard.innerHTML = `
        <div style="font-size: 12px; font-weight: 500; color: #1976D2; margin-bottom: 4px;">${title}</div>
        <div style="font-size: 12px; color: #666;">${desc}</div>
        ${warningHtml}
        <div class="actions" style="position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity 0.2s;">
          <button onclick="editItem(this)" style="margin-right: 4px; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer;">编辑</button>
          <button onclick="deleteItem(this)" style="background: #fff; border: 1px solid #ff4d4f; border-radius: 4px; padding: 2px 6px; font-size: 10px; color: #ff4d4f; cursor: pointer;">删除</button>
        </div>
      `;

      container.appendChild(newCard);
    }
    
    function addTag() {
      var container = document.getElementById('人群场景-container');
      var tagText = prompt('请输入新标签:');
      if (!tagText) return;
      
      var type = prompt('请选择标签类型（1=人群，2=场景）:');
      var bgColor = type === '1' ? '#FFF3E0' : '#E8F5E9';
      var textColor = type === '1' ? '#E65100' : '#2E7D32';
      
      var newTag = document.createElement('span');
      newTag.className = 'tag-item';
      newTag.style.cssText = `padding: 6px 12px; background: ${bgColor}; border-radius: 20px; font-size: 13px; color: ${textColor}; position: relative; cursor: pointer; margin-right: 8px; margin-bottom: 8px;`;
      newTag.textContent = tagText;
      newTag.onmouseenter = function() { showTagActions(this); };
      newTag.onmouseleave = function() { hideTagActions(this); };
      
      container.appendChild(newTag);
    }

    function createAsSkill() {
      var skillName = prompt('请输入Skill名称:');
      if (!skillName) return;

      var skillDesc = prompt('请输入Skill描述:');
      if (!skillDesc) return;

      alert('Skill "' + skillName + '" 创建成功！描述: ' + skillDesc);
    }

    function editDiscount() {
      var discountValue = document.getElementById('discountValue').textContent;
      var discountTime = document.getElementById('discountTime').textContent.replace('生效时间: ', '');
      var timeParts = discountTime.split(' 至 ');
      
      var newValue = prompt('请输入折扣优惠信息:', discountValue);
      if (!newValue) return;
      
      var startDate = prompt('请输入开始日期:', timeParts[0]);
      if (!startDate) return;
      
      var endDate = prompt('请输入结束日期:', timeParts[1]);
      if (!endDate) return;

      document.getElementById('discountValue').textContent = newValue;
      document.getElementById('discountTime').textContent = '生效时间: ' + startDate + ' 至 ' + endDate;
    }

    function editHotspot() {
      var hotspotValue = document.getElementById('hotspotValue').textContent;
      var newValue = prompt('请输入热点结合内容:', hotspotValue);
      if (newValue) {
        document.getElementById('hotspotValue').textContent = newValue;
      }
    }

    function openDateEditor(type) {
      var timeEl, startDate = '', endDate = '';
      
      if (type === 'discount') {
        timeEl = document.getElementById('discountTime');
      } else if (type === 'node') {
        timeEl = document.getElementById('marketingNodeTime');
      }
      
      if (timeEl && timeEl.textContent) {
        var timeText = timeEl.textContent.replace('生效时间: ', '');
        var timeParts = timeText.split(' 至 ');
        if (timeParts.length === 2) {
          startDate = timeParts[0];
          endDate = timeParts[1];
        }
      }
      
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div class="modal-title">编辑生效时间</div>
          <div class="modal-content">
            <div class="date-range-inputs">
              <div class="date-input">
                <label>开始日期</label>
                <input type="date" id="dateStart" value="${startDate}">
              </div>
              <div class="date-input">
                <label>结束日期</label>
                <input type="date" id="dateEnd" value="${endDate}">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
            <button class="modal-btn modal-btn-confirm" onclick="confirmDateEdit('${type}')">确认</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function confirmDateEdit(type) {
      var startDate = document.getElementById('dateStart').value;
      var endDate = document.getElementById('dateEnd').value;
      
      if (!startDate || !endDate) {
        alert('请选择开始日期和结束日期');
        return;
      }
      
      if (type === 'discount') {
        document.getElementById('discountTime').textContent = '生效时间: ' + startDate + ' 至 ' + endDate;
      } else if (type === 'node') {
        document.getElementById('marketingNodeTime').textContent = '生效时间: ' + startDate + ' 至 ' + endDate;
      }
      
      closeModal();
    }

    function editMarketingNode() {
      var currentValue = document.getElementById('marketingNodeValue').textContent;
      var currentTime = document.getElementById('marketingNodeTime').textContent.replace('生效时间: ', '');
      var timeParts = currentTime.split(' 至 ');
      var startDate = timeParts.length === 2 ? timeParts[0] : '';
      var endDate = timeParts.length === 2 ? timeParts[1] : '';
      
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

          <div class="modal-content">
            <div style="margin-bottom: 12px;">
              <span style="font-size: 13px; color: #666; margin-bottom: 8px; display: block;">选择系统节点:</span>
              <div class="system-nodes">
                <span class="system-node-tag" onclick="selectSystemNode('端午节', this)">端午节</span>
                <span class="system-node-tag" onclick="selectSystemNode('618', this)">618</span>
                <span class="system-node-tag" onclick="selectSystemNode('父亲节', this)">父亲节</span>
              </div>
            </div>
            <input type="text" class="modal-input" id="customNodeInput" placeholder="或手动输入营销节点名称" value="${currentValue}">
            <div class="date-range-inputs">
              <div class="date-input">
                <label>开始日期</label>
                <input type="date" id="nodeStartDate" value="${startDate}">
              </div>
              <div class="date-input">
                <label>结束日期</label>
                <input type="date" id="nodeEndDate" value="${endDate}">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
            <button class="modal-btn modal-btn-confirm" onclick="confirmMarketingNodeEdit()">确认</button>
          </div>
        </div>
      `;

    function selectSystemNode(nodeName, element) {
      document.getElementById('customNodeInput').value = nodeName;
      document.querySelectorAll('.system-node-tag').forEach(tag => tag.style.borderColor = '#e8e8e8');
      element.style.borderColor = '#0066FF';
      element.style.color = '#0066FF';
    }

    function closeModal() {
      var overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
    }

    function confirmMarketingNodeEdit() {
      var nodeValue = document.getElementById('customNodeInput').value;
      var startDate = document.getElementById('nodeStartDate').value;
      var endDate = document.getElementById('nodeEndDate').value;

      if (!nodeValue) {
        alert('请输入营销节点名称');
        return;
      }

      document.getElementById('marketingNodeValue').textContent = nodeValue;
      if (startDate && endDate) {
        document.getElementById('marketingNodeTime').textContent = '生效时间: ' + startDate + ' 至 ' + endDate;
      }

      closeModal();
    }

    function deleteMarketingInfo(type) {
      var confirmText = '';
      if (type === 'discount') confirmText = '确定删除折扣优惠信息吗？';
      else if (type === 'hotspot') confirmText = '确定删除热点结合信息吗？';
      else if (type === 'node') confirmText = '确定删除营销节点吗？';

      if (confirm(confirmText)) {
        if (type === 'discount') {
          document.getElementById('discountValue').textContent = '-';
          document.getElementById('discountTime').textContent = '';
        } else if (type === 'hotspot') {
          document.getElementById('hotspotValue').textContent = '-';
        } else if (type === 'node') {
          document.getElementById('marketingNodeValue').textContent = '-';
          document.getElementById('marketingNodeTime').textContent = '';
        }
      }
    }

    function goToNextStage() {
      var currentStage = document.querySelector('.progress-step.active');
      var stages = document.querySelectorAll('.progress-step');
      var currentIndex = Array.from(stages).indexOf(currentStage);
      
      if (currentIndex < stages.length - 1) {
        currentStage.classList.remove('active');
        currentStage.classList.add('completed');
        
        var nextStage = stages[currentIndex + 1];
        nextStage.classList.add('active');
        
        if (currentIndex === 0) {
          // 清空右侧内容，显示待加载状态
          var stageDetailSection = document.querySelector('.stage-detail-section');
          stageDetailSection.innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;">

            </div>
          `;
          showStageTwo();
        } else if (currentIndex === 1) {

        } else if (currentIndex === 2) {
          // 这个由 confirmStageThreeAndGoNext 处理
        }
      }
    }
    
    function goToPrevStage() {
      var currentStage = document.querySelector('.progress-step.active');
      var stages = document.querySelectorAll('.progress-step');
      var currentIndex = Array.from(stages).indexOf(currentStage);
      
      if (currentIndex > 0) {
        currentStage.classList.remove('active');
        
        var prevStage = stages[currentIndex - 1];
        prevStage.classList.remove('completed');
        prevStage.classList.add('active');
        
        if (currentIndex === 1) {
          showStageOne();
        } else if (currentIndex === 2) {
          renderStageTwoContent();
        } else if (currentIndex === 3) {
          showStageThree();
        } else if (currentIndex === 4) {
          showStageFour();

    function initCropResize() {
      var cropArea = document.getElementById('cropArea');
      var container = document.getElementById('cropPreviewContainer');
      var isResizing = false;
      var isDragging = false;
      var startX, startY, startLeft, startTop, startWidth, startHeight;
      var currentHandle = null;
      
      cropArea.addEventListener('mousedown', function(e) {
        if (!e.target.classList.contains('resize-handle')) {
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          var rect = cropArea.getBoundingClientRect();
          var containerRect = container.getBoundingClientRect();
          startLeft = rect.left - containerRect.left;
          startTop = rect.top - containerRect.top;
          document.addEventListener('mousemove', onDrag);
          document.addEventListener('mouseup', onEnd);
        }
      });
      
      var handles = document.querySelectorAll('.resize-handle');
      handles.forEach(function(handle) {
        handle.addEventListener('mousedown', function(e) {
          e.stopPropagation();
          isResizing = true;
          currentHandle = handle.id;
          startX = e.clientX;
          startY = e.clientY;
          var rect = cropArea.getBoundingClientRect();
          startLeft = rect.left - container.getBoundingClientRect().left;
          startTop = rect.top - container.getBoundingClientRect().top;
          startWidth = rect.width;
          startHeight = rect.height;
          document.addEventListener('mousemove', onResize);
          document.addEventListener('mouseup', onEnd);
        });
      });
      
      function onDrag(e) {
        if (!isDragging) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        var newLeft = startLeft + dx;
        var newTop = startTop + dy;
        var containerRect = container.getBoundingClientRect();
        
        newLeft = Math.max(0, Math.min(newLeft, containerRect.width - cropArea.offsetWidth));
        newTop = Math.max(0, Math.min(newTop, containerRect.height - cropArea.offsetHeight));
        
        cropArea.style.left = newLeft + 'px';
        cropArea.style.top = newTop + 'px';
      }
      
      function onResize(e) {
        if (!isResizing || !currentHandle) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        var newLeft = startLeft;
        var newTop = startTop;
        var newWidth = startWidth;
        var newHeight = startHeight;
        
        if (currentHandle.includes('L')) {
          newWidth = Math.max(50, startWidth - dx);
          newLeft = startLeft + dx;
        }
        if (currentHandle.includes('R')) {
          newWidth = Math.max(50, startWidth + dx);
        }
        if (currentHandle.includes('T')) {
          newHeight = Math.max(50, startHeight - dy);
          newTop = startTop + dy;
        }
        if (currentHandle.includes('B')) {
          newHeight = Math.max(50, startHeight + dy);
        }
        
        cropArea.style.left = newLeft + 'px';
        cropArea.style.top = newTop + 'px';
        cropArea.style.width = newWidth + 'px';
        cropArea.style.height = newHeight + 'px';
      }
      
      function onEnd() {
        isDragging = false;
        isResizing = false;
        currentHandle = null;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mousemove', onResize);
        document.removeEventListener('mouseup', onEnd);
      }
    }
    
    function setCropRatio(ratio) {
      document.querySelectorAll('.ratio-btn').forEach(function(btn) {
        btn.style.background = btn.dataset.ratio === ratio ? '#0066FF' : 'rgba(255,255,255,0.08)';
        btn.style.color = btn.dataset.ratio === ratio ? '#fff' : '#999';
      });
      
      var cropArea = document.getElementById('cropArea');
      var container = document.getElementById('cropPreviewContainer');
      
      if (ratio === '自由') {
        return;
      }
      
      var [w, h] = ratio.split(':').map(Number);
      var containerWidth = container.offsetWidth;
      var containerHeight = container.offsetHeight;
      var scale = Math.min(containerWidth / w, containerHeight / h) * 0.8;
      
      var newWidth = w * scale;
      var newHeight = h * scale;
      
      cropArea.style.width = newWidth + 'px';
      cropArea.style.height = newHeight + 'px';
      cropArea.style.left = (containerWidth - newWidth) / 2 + 'px';
      cropArea.style.top = (containerHeight - newHeight) / 2 + 'px';
    }

    function formatTime(seconds) {
      var mins = Math.floor(seconds / 60);
      var secs = Math.floor(seconds % 60);
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

    function enableEdit(element) {
      element.contentEditable = 'true';
      element.focus();
      element.style.outline = '2px solid #0066FF';
      element.style.background = '#fff';

      element.addEventListener('blur', function saveEdit() {
        element.contentEditable = 'false';
        element.style.outline = 'none';
        element.style.background = 'transparent';
        element.removeEventListener('blur', saveEdit);
      });

      element.addEventListener('keydown', function handleEnter(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          element.blur();
        }
      });
    }
