<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试页面</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      text-align: center;
      background: #f5f7fa;
    }
    h1 {
      color: #0066FF;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    .btn {
      background: #0066FF;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    .btn:hover {
      background: #0047CC;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ 测试页面成功加载！</h1>
    <p>如果您能看到这个页面，说明服务器工作正常。</p>
    <button class="btn" onclick="window.location.href='index.html'">前往 AI 创意页面</button>
    <button class="btn" onclick="window.location.href='chat.html'" style="margin-left: 10px; background: #00C853;">前往对话详情</button>
  </div>
</body>
</html>
